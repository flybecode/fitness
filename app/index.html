<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fitness</title>
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Fitness">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main id="view"></main>

  <div id="timer" data-mode="hidden" aria-live="polite">
    <div class="timer-inner">
      <div class="timer-text"><span id="timer-label">Pause</span><b id="timer-time">0:00</b></div>
      <div class="timer-btns">
        <button data-act="restAdd" data-s="-15">−15</button>
        <button data-act="restAdd" data-s="15">+15</button>
        <button data-act="restSkip">Weiter</button>
      </div>
    </div>
  </div>

  <nav id="tabbar">
    <a href="#/heute" data-tab="heute">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      <span>Heute</span>
    </a>
    <a href="#/ernaehrung" data-tab="ernaehrung">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M18 21V3c-2.2 0-4 2.5-4 6s1.3 4.5 4 4.5"/></svg>
      <span>Ernährung</span>
    </a>
    <a href="#/training" data-tab="training">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5v11M3.5 9v6M17.5 6.5v11M20.5 9v6M6.5 12h11"/></svg>
      <span>Training</span>
    </a>
    <a href="#/koerper" data-tab="koerper">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 6-7"/></svg>
      <span>Körper</span>
    </a>
  </nav>

  <div id="sheet"></div>
  <div id="toast" role="status"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
